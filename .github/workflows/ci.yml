
name: Kalvi CI

on:
  push:
    branches: [master, feat/github-actions-cicd, feat/backend-ci]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lms-ai-agent/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lms-ai-agent/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  backend-checks:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lms-ai-agent/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lms-ai-agent/backend/requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Run backend tests
        run: python -m pytest -v
